server.port=${PORT:8080}
spring.application.name=prReviewBot

# API Keys
github.token=${GITHUB_TOKEN}
gemini.api.key=${GEMINI_API_KEY}
webhook.secret=${WEBHOOK_SECRET:default-webhook-secret}

# Active profile - change to 'prod' when deploying
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== PostgreSQL =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codereviewdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rachit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rachit123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA (common settings) =====
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codereviewdb}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:rachit}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:rachit123}

# ===== Redis =====
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.repositories.enabled=false
spring.cache.type=none

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# CORS Settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===== PgVector Embedding Store =====
langchain4j.pgvector.host=${SPRING_DATASOURCE_HOST:}
langchain4j.pgvector.port=${SPRING_DATASOURCE_PORT:0}
langchain4j.pgvector.database=${SPRING_DATASOURCE_DB:}
langchain4j.pgvector.user=${SPRING_DATASOURCE_USERNAME:rachit}
langchain4j.pgvector.password=${SPRING_DATASOURCE_PASSWORD:rachit123}
langchain4j.pgvector.table-name=langchain4j_embeddings
langchain4j.pgvector.dimension=768

# ===== RAG Indexing Secret & Config File Exclusions (NIO Glob Syntax) =====
# Configurable .gitignore-style NIO glob patterns to exclude secret-bearing and config files during indexing.
rag.indexing.excluded-patterns=**/.env*,**/application*.properties,**/application*.yml,**/docker-compose*.yml,**/k8s/secret*.yaml,**/k8s/secret*.yml

# ===== SonarQube Integration =====
sonarqube.url=${SONARQUBE_URL:http://localhost:9000}
sonarqube.token=${SONARQUBE_TOKEN:}