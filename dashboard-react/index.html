<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinAI | AI Code Review & Intelligence Platform</title>
    <meta name="description" content="Autonomous AI security agent auditing codebases, pull requests, vector RAG knowledge bases, and API keys in real time." />
    <!-- Google Fonts: Hanken Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                background: "#0e1513",
                surface: "#0e1513",
                "surface-dim": "#0e1513",
                "surface-bright": "#333b39",
                "surface-container-lowest": "#09100e",
                "surface-container-low": "#161d1b",
                "surface-container": "#1a211f",
                "surface-container-high": "#242b2a",
                "surface-container-highest": "#2f3634",
                primary: "#2dd4bf",
                "primary-bright": "#57f1db",
                "primary-container": "#00574d",
                secondary: "#c6c6ca",
                tertiary: "#d9dadc",
                error: "#ffb4ab",
                "error-container": "#93000a",
                "on-surface": "#dde4e1",
                "on-surface-variant": "#bacac5",
                outline: "#859490",
                "outline-variant": "#3c4a46"
              },
              fontFamily: {
                sans: ["Inter", "sans-serif"],
                display: ["Hanken Grotesk", "sans-serif"],
                mono: ["JetBrains Mono", "monospace"]
              }
            }
          }
        }
    </script>
  </head>
  <body class="bg-[#0e1513] text-[#dde4e1] antialiased selection:bg-[#2dd4bf]/20 selection:text-[#57f1db]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
