services:
  # Spring Boot Backend Service
  - type: web
    name: sentinai-backend
    env: docker
    dockerfilePath: ./Dockerfile
    rootDir: ./prReviewBot
    region: singapore
    plan: free
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sentinai-db
          property: connectionString

  # Python LangGraph Agent Microservice
  - type: web
    name: sentinai-agent-service
    env: python
    rootDir: ./agent-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    region: singapore
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  # React Dashboard Frontend
  - type: web
    name: sentinai-dashboard
    env: static
    rootDir: ./dashboard-react
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    region: singapore
    plan: free

databases:
  - name: sentinai-db
    databaseName: codereviewdb
    user: rachit
    region: singapore
    plan: free
