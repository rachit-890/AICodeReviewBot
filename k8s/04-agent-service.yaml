apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  labels:
    app: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: prreviewbot-agent-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
spec:
  type: ClusterIP
  selector:
    app: agent-service
  ports:
    - port: 8000
      targetPort: 8000
